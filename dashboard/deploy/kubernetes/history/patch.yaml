apiVersion: apps/v1
kind: Deployment
metadata:
  name: cosmo-dashboard
spec:
  template:
    spec:
      containers:
        - name: dashboard
          env:
            - name: COSMO_DATA_MODE
              value: history
      volumes:
        - name: data
          emptyDir: null
          persistentVolumeClaim:
            claimName: cosmo-history
