apiVersion: v1
kind: ServiceAccount
metadata:
  name: cosmo-collector-site-vso
  namespace: cosmo
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: cosmo-collector-site-vso
  namespace: cosmo
spec:
  address: https://vault-vso.vault.svc.cluster.local:8443
  tlsServerName: vault-vso.techdrabble.com
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: cosmo-collector-site-vso
  namespace: cosmo
spec:
  vaultConnectionRef: cosmo-collector-site-vso
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: cosmo-collector-site-vso
    serviceAccount: cosmo-collector-site-vso
    audiences:
      - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: cosmo-collector-site-vso
  namespace: cosmo
spec:
  vaultAuthRef: cosmo-collector-site-vso
  type: kv-v2
  mount: kv
  path: apps/cosmo-collector/site
  refreshAfter: 1m
  destination:
    name: cosmo-site-service-vault
    create: true
